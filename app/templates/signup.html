{% extends "auth_base.html" %}
{% block title %}계정 만들기 · {{ APP_NAME }}{% endblock %}
{% block box %}
<div class="panel">
  <p class="auth-title">계정 만들기</p>
  <p class="muted small">원장님은 학원을 새로 등록하고, 선생님은 원장님께 받은 초대 코드로 들어옵니다.</p>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/signup">
    <div class="seg" role="radiogroup" aria-label="가입 방법">
      <label><input type="radio" name="mode" value="new" {% if form.mode != "join" %}checked{% endif %}>학원 새로 등록</label>
      <label><input type="radio" name="mode" value="join" {% if form.mode == "join" %}checked{% endif %}>초대 코드로 합류</label>
    </div>

    <div class="field" data-mode="new">
      <label for="academy_name">학원 이름</label>
      <input type="text" id="academy_name" name="academy_name" value="{{ form.academy_name or '' }}" placeholder="예: 전주 ○○영어학원">
    </div>
    <div class="field" data-mode="join">
      <label for="invite_code">학원 초대 코드</label>
      <input type="text" id="invite_code" name="invite_code" value="{{ form.invite_code or '' }}" autocapitalize="characters" placeholder="8자리">
      <span class="hint">원장님 설정 화면의 '선생님' 칸에 있습니다.</span>
    </div>

    <div class="row">
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" value="{{ form.name or '' }}" required>
      </div>
      <div class="field">
        <label for="login_id">아이디</label>
        <input type="text" id="login_id" name="login_id" value="{{ form.login_id or '' }}" autocapitalize="off" autocomplete="username" required>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="pin">PIN <span class="hint">숫자 4~8자리</span></label>
        <input type="password" id="pin" name="pin" inputmode="numeric" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="pin2">PIN 확인</label>
        <input type="password" id="pin2" name="pin2" inputmode="numeric" autocomplete="new-password" required>
      </div>
    </div>
    <div class="field">
      <label for="gemini_key">Gemini API 키 <span class="hint">나중에 설정에서 넣어도 됩니다. 키가 없다면 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 무료로 받을 수 있어요.</span></label>
      <input type="password" id="gemini_key" name="gemini_key" autocomplete="off">
    </div>
    <button class="btn" type="submit" style="width:100%">계정 만들기</button>
  </form>
</div>
<p class="small muted" style="text-align:center">이미 계정이 있나요? <a href="/login">로그인</a></p>
<script>
  const sync = () => {
    const m = document.querySelector('input[name=mode]:checked').value;
    document.querySelectorAll('[data-mode]').forEach(el => el.hidden = el.dataset.mode !== m);
  };
  document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', sync));
  sync();
</script>
{% endblock %}
