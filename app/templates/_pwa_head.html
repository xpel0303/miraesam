{# 홈 화면 앱(PWA): 앱 이름·아이콘은 학원 것. 학생 화면이면 그 학생 코드로 시작 (pwa_code), 선생님은 학원 번호(?a=) #}
{% set _pa = academy if academy is defined and academy else (pwa_academy if pwa_academy is defined else None) %}
{% set _pn = pwa_brand.names(_pa, "student" if pwa_code else "teacher") %}
<link rel="manifest" href="/manifest.webmanifest{% if pwa_code %}?s={{ pwa_code }}{% elif _pa %}?a={{ _pa.id }}{% endif %}">
<meta name="theme-color" content="#1B2A5C">
<link rel="apple-touch-icon" href="{{ pwa_brand.icon_url(_pa, 180) }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ _pn[1] }}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
