<div class="panel-head" style="margin-bottom:4px"><h1>학습관리</h1></div>
{% if tab not in ("homework", "exams") %}<p class="lead">출결·숙제·시험·진도를 매일 한 표에 적으면 학부모 화면(앱)에 바로 쌓이고, 알림을 켠 학부모님 휴대폰으로 알림이 가요. 카톡·문자 비용이 없어요.</p>{% endif %}
<nav class="tabs" aria-label="학습관리">
  <a href="/care" {% if tab == "daily" %}aria-current="page"{% endif %}>매일 기록</a>
  <a href="/homework" {% if tab == "homework" %}aria-current="page"{% endif %}>숙제</a>
  <a href="/reports" {% if tab == "exams" %}aria-current="page"{% endif %}>시험 결과</a>
  <a href="/care/reports" {% if tab == "reports" %}aria-current="page"{% endif %}>월간 리포트</a>
  <a href="/care/books" {% if tab == "books" %}aria-current="page"{% endif %}>교재</a>
  <a href="/care/photos" {% if tab == "photos" %}aria-current="page"{% endif %}>사진</a>
  <a href="/care/parents" {% if tab == "parents" %}aria-current="page"{% endif %}>학부모 앱 연결</a>
  <a href="/care/notices" {% if tab == "notices" %}aria-current="page"{% endif %}>공지</a>
  <a href="/care/log" {% if tab == "log" %}aria-current="page"{% endif %}>알림 기록</a>
</nav>
<style>
.care-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.care-chips a { padding:6px 14px; border:2px solid var(--line); border-radius:999px; text-decoration:none; color:var(--ink-2); background:#fff; font-size:.9rem; }
.care-chips a[aria-current="page"] { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:800; }
.pick { display:inline-flex; gap:3px; }
.pick label { margin:0; cursor:pointer; }
.pick input { position:absolute; opacity:0; pointer-events:none; }
.pick span { display:inline-block; min-width:30px; text-align:center; padding:4px 6px; border:2px solid var(--line); border-radius:8px; font-weight:700; font-size:.85rem; color:var(--ink-3); background:#fff; }
.pick input:focus-visible + span { outline:2px solid var(--brand); outline-offset:1px; }
.pick input:checked + span { color:#fff; border-color:transparent; }
.pick .v-출:checked + span, .pick .v-O:checked + span { background:#2E9E6A; }
.pick .v-지:checked + span, .pick .v-△:checked + span { background:#E0A100; }
.pick .v-결:checked + span, .pick .v-X:checked + span { background:#D9534F; }
table.care td { vertical-align:top; padding-top:8px; padding-bottom:8px; }
table.care input[type=text] { padding:5px 8px; font-size:.88rem; }
.care-sticky { position:sticky; bottom:0; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(4px); padding:12px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; z-index:5; }
.bell { font-size:.8rem; white-space:nowrap; }
@media (max-width: 700px) {
  table.care thead { display:none; }
  table.care, table.care tbody, table.care tr, table.care td { display:block; width:100%; }
  table.care tr { padding:10px 14px; border-bottom:2px solid var(--line); }
  table.care td { padding:4px 0 !important; border:0 !important; white-space:normal !important; min-width:0 !important; }
  table.care td[data-l] { display:flex; align-items:center; gap:8px; }
  table.care td[data-l]::before { content:attr(data-l); flex:0 0 40px; font-size:.78rem; color:var(--ink-3); }
  table.care td input[type=text] { flex:1; min-width:0 !important; }
}
.bell.off { color:var(--ink-3); }
</style>
